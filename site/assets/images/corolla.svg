<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f5f5f7"/>
  <ellipse cx="400" cy="420" rx="320" ry="16" fill="#d6d6d6" opacity="0.6"/>
  <!-- Sedan Body: Corolla GLi -->
  <g transform="translate(60, 130)">
    <!-- Cabin & Roof -->
    <path d="M 220 120 Q 280 40 400 40 Q 520 40 570 120 Z" fill="#e3e4e5" stroke="#707070" stroke-width="2"/>
    <!-- Windows -->
    <path d="M 245 115 Q 290 55 385 55 L 385 115 Z" fill="#1d1d1f" opacity="0.85"/>
    <path d="M 400 115 L 400 55 Q 500 55 545 115 Z" fill="#1d1d1f" opacity="0.85"/>
    <!-- Body Chassis -->
    <path d="M 100 190 Q 90 140 180 130 L 230 120 Q 300 35 480 35 Q 560 35 600 120 L 670 140 Q 710 160 700 210 L 670 220 L 610 220 Q 590 170 510 170 Q 430 170 410 220 L 270 220 Q 250 170 170 170 Q 90 170 70 220 L 40 210 Q 30 195 50 170 Q 70 160 100 190 Z" fill="#e3e4e5" stroke="#1d1d1f" stroke-width="3"/>
    <!-- Headlight & Taillight -->
    <path d="M 42 165 L 75 160 L 70 175 Z" fill="#0071e3"/>
    <path d="M 685 155 L 660 152 L 665 170 Z" fill="#b64400"/>
    <!-- Door Cut Lines & Handle -->
    <path d="M 320 125 L 300 215" stroke="#707070" stroke-width="2"/>
    <path d="M 460 125 L 450 215" stroke="#707070" stroke-width="2"/>
    <rect x="330" y="145" width="28" height="5" rx="2.5" fill="#707070"/>
    <rect x="470" y="145" width="28" height="5" rx="2.5" fill="#707070"/>
    <!-- Front Wheel -->
    <g transform="translate(130, 210)">
      <circle cx="40" cy="40" r="50" fill="#1d1d1f"/>
      <circle cx="40" cy="40" r="32" fill="#707070"/>
      <circle cx="40" cy="40" r="16" fill="#e3e4e5"/>
      <line x1="40" y1="10" x2="40" y2="70" stroke="#1d1d1f" stroke-width="3"/>
      <line x1="10" y1="40" x2="70" y2="40" stroke="#1d1d1f" stroke-width="3"/>
    </g>
    <!-- Rear Wheel -->
    <g transform="translate(470, 210)">
      <circle cx="40" cy="40" r="50" fill="#1d1d1f"/>
      <circle cx="40" cy="40" r="32" fill="#707070"/>
      <circle cx="40" cy="40" r="16" fill="#e3e4e5"/>
      <line x1="40" y1="10" x2="40" y2="70" stroke="#1d1d1f" stroke-width="3"/>
      <line x1="10" y1="40" x2="70" y2="40" stroke="#1d1d1f" stroke-width="3"/>
    </g>
  </g>
  <text x="400" y="470" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#707070" text-anchor="middle" letter-spacing="1">CATEGORIA SEDAN · TOYOTA COROLLA GLI</text>
</svg>
