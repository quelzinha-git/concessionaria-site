<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f5f5f7"/>
  <ellipse cx="400" cy="425" rx="320" ry="16" fill="#d6d6d6" opacity="0.6"/>
  <!-- Pickup Truck Body: Fiat Strada Endurance -->
  <g transform="translate(60, 110)">
    <!-- Cabin & Roof -->
    <path d="M 210 130 Q 250 50 350 48 L 460 50 L 465 130 Z" fill="#b64400" stroke="#1d1d1f" stroke-width="2"/>
    <!-- Windows -->
    <path d="M 235 120 Q 265 62 340 62 L 340 120 Z" fill="#1d1d1f" opacity="0.85"/>
    <path d="M 355 120 L 355 62 L 440 62 L 445 120 Z" fill="#1d1d1f" opacity="0.85"/>
    <!-- Cargo Bed Bar (Santo Antônio / Protector) -->
    <path d="M 465 65 L 490 65 L 490 145" stroke="#1d1d1f" stroke-width="6" fill="none"/>
    <!-- Body Chassis with Open Bed -->
    <path d="M 100 195 Q 90 145 180 135 L 210 125 Q 260 46 360 48 L 470 50 L 475 145 L 670 145 L 685 230 L 650 230 Q 630 175 550 175 Q 470 175 450 230 L 290 230 Q 270 175 190 175 Q 110 175 90 230 L 60 220 Q 40 200 65 170 Q 80 160 100 195 Z" fill="#b64400" stroke="#1d1d1f" stroke-width="3"/>
    <!-- Cargo Bed internal floor line -->
    <line x1="475" y1="160" x2="665" y2="160" stroke="#1d1d1f" stroke-width="2"/>
    <!-- Wheel Arch Cladding -->
    <path d="M 80 230 Q 100 165 190 165 Q 280 165 300 230 Z" stroke="#1d1d1f" stroke-width="10" fill="none"/>
    <path d="M 440 230 Q 460 165 550 165 Q 640 165 660 230 Z" stroke="#1d1d1f" stroke-width="10" fill="none"/>
    <!-- Headlight & Taillight -->
    <path d="M 52 170 L 85 160 L 80 180 Z" fill="#0071e3"/>
    <path d="M 678 150 L 660 150 L 665 180 Z" fill="#ffffff"/>
    <!-- Door Cut Lines & Handle -->
    <path d="M 330 125 L 315 225" stroke="#1d1d1f" stroke-width="2"/>
    <rect x="340" y="145" width="26" height="6" rx="3" fill="#1d1d1f"/>
    <!-- Front Wheel -->
    <g transform="translate(150, 220)">
      <circle cx="40" cy="40" r="52" fill="#1d1d1f"/>
      <circle cx="40" cy="40" r="32" fill="#707070"/>
      <circle cx="40" cy="40" r="16" fill="#1d1d1f"/>
    </g>
    <!-- Rear Wheel -->
    <g transform="translate(510, 220)">
      <circle cx="40" cy="40" r="52" fill="#1d1d1f"/>
      <circle cx="40" cy="40" r="32" fill="#707070"/>
      <circle cx="40" cy="40" r="16" fill="#1d1d1f"/>
    </g>
  </g>
  <text x="400" y="470" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#707070" text-anchor="middle" letter-spacing="1">CATEGORIA PICAPE · FIAT STRADA ENDURANCE</text>
</svg>
